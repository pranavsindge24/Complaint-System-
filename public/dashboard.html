<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusDesk — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>C</text></svg>" />
</head>
<body>
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="brand-mark sm">CD</div>
        <div class="brand-text">
          <strong>CampusDesk</strong>
          <span>Complaint Cloud</span>
        </div>
      </div>

      <div class="side-role" id="sideRole"></div>

      <nav class="side-nav" id="sideNav"></nav>

      <div class="side-foot">
        <div class="side-user" id="sideUser"></div>
        <button class="side-logout" id="logoutBtn">
          <span class="ico">⏻</span> Log out
        </button>
      </div>
    </aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <h2 class="page-title" id="pageTitle">Overview</h2>
        <div class="top-actions">
          <button class="icon-btn" id="bellBtn" title="Notifications">
            <span class="bell">🔔</span>
            <i class="dot-count hidden" id="bellCount">0</i>
          </button>
          <div class="top-user" id="topUser"></div>
        </div>
      </header>

      <main class="content" id="content">
        <div class="page-loading"><span class="spinner lg"></span> Loading your workspace…</div>
      </main>
    </div>
  </div>

  <div class="drawer-overlay hidden" id="drawerOverlay"></div>
  <aside class="drawer hidden" id="notifDrawer" aria-label="Notifications">
    <div class="drawer-head">
      <h3>Notifications</h3>
      <div class="drawer-actions">
        <button class="btn btn-ghost btn-sm" id="markAllRead">Mark all read</button>
        <button class="icon-btn" id="closeDrawer" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="drawer-body" id="notifList"><div class="page-loading"><span class="spinner"></span></div></div>
  </aside>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toastHost" class="toast-host"></div>

  <script src="/js/common.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
